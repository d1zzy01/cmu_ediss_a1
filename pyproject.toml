[project]
name = "a1-bookstore-service"
version = "0.1.0"
description = "REST backend for the data intensive systems assignment"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "google-genai>=1.30.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "pymysql>=1.1.1",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
