apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-service
  namespace: bookstore-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-service
  template:
    metadata:
      labels:
        app: book-service
    spec:
      volumes:
        - name: circuit-breaker-state
          emptyDir: {}
      containers:
        - name: book-service
          image: d1zzy0316/book-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          volumeMounts:
            - name: circuit-breaker-state
              mountPath: /app/circuit-breaker
          env:
            - name: RECOMMENDATION_SERVICE_URL
              value: "http://34.195.107.7"
            - name: RECOMMENDATION_TIMEOUT_SECONDS
              value: "3.0"
            - name: CIRCUIT_BREAKER_STATE_PATH
              value: "/app/circuit-breaker/state.json"
            - name: CIRCUIT_BREAKER_RESET_TIMEOUT_SECONDS
              value: "60.0"
          livenessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
